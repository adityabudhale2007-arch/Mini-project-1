<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Smart Classroom - Login</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="login-page"><section class="login-card"><div class="login-brand"><div class="brand-icon">🎓</div><h1>Smart Classroom & Timetable Scheduler</h1><p>Manage classrooms, teachers and timetables efficiently</p></div><form class="login-form" id="loginForm" action="dashboard.html"><div class="form-group"><label>Email / Username</label><input id="loginEmail" class="form-control" type="text" placeholder="Enter your email" required></div><div class="form-group"><label>Password</label><input class="form-control" type="password" placeholder="Enter your password" required></div><div class="form-group"><label>Login as</label><div class="role-grid"><label><input type="radio" name="role" value="Admin" checked> Admin</label><label><input type="radio" name="role" value="Teacher"> Teacher</label><label><input type="radio" name="role" value="Student"> Student</label></div></div><a class="forgot" href="#" data-coming-soon="Password reset isn't available in this demo yet.">Forgot Password?</a><button class="btn" type="submit">Login</button></form></section></main><script src="js/app.js"></script></body></html>
